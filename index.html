<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DataVis - Assignment 2</title>
        
    <!-- Loading d3js version 5-->
    <script src="d3.v5.min.js"></script>
  
    
    <!-- Loading style.css; use if needed -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- YOUR SOLUTION GOES HERE-->
    <header class="page-header">
        <h1><strong>CAR DATA VISUALIZATION</strong></h1>
        <p class="subtitle">Horsepower against retail price. Color shows drive type,
            shape shows car type. Click a car to see its details.</p>
    </header>

    <div class="container" id="container">
        <div id="main">
            <svg id="scatterplot"></svg>
            <button id="reset-zoom" aria-label="Fit chart to view" title="Fit chart to view">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                </svg>
                <span id="zoom-level">1×</span>
            </button>
        </div>

        <div class="side">
            <div class="panel" id="details">
                <button class="close-btn" aria-label="Close">&times;</button>
                <h3>Selected Car</h3>
                <div id="details-body"></div>
            </div>

            <div class="panel" id="starbox">
                <button class="close-btn" aria-label="Close">&times;</button>
                <svg id="starplot"></svg>
            </div>
        </div>
    </div>

<!-- loading the main javascript file; implement logic there -->
<script src="main.js"></script>

</body>
</html>
